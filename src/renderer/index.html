<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaqtWise</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="alert.css">
</head>
<body>
  <div id="splash" class="splash" role="img" aria-label="WaqtWise. Make every waqt count, wisely.">
    <img class="splash-logo" src="logo-large.png" alt="">
    <div class="splash-title">WaqtWise</div>
    <p class="splash-slogan">Make every waqt count, wisely.</p>
    <div class="splash-strip" aria-hidden="true">
      <div class="z1"></div><div class="z2"></div><div class="z3"></div><div class="z4"></div><div class="z5"></div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Menu" aria-expanded="false"></button>
      <img class="app-logo" src="logo.png" alt="">
      <h1 class="app-title">WaqtWise</h1>
    </div>
    <div class="topbar-right">
      <button id="theme-btn" class="icon-btn" title="Switch theme" aria-label="Switch theme"></button>
      <div class="bell-wrap">
        <button id="bell-btn" class="icon-btn bell-empty" title="No missed reminders" aria-label="No missed reminders"></button>
        <div id="bell-panel" class="popover" hidden></div>
      </div>
      <button id="add-btn" class="btn primary tall"></button>
    </div>
  </header>

  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer" aria-label="Main menu" hidden></nav>

  <main id="view"></main>

  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="dom.js"></script>
  <script src="alert-view.js"></script>
  <script src="form.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
